<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Density 360 Particle Visual Art Engine</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 12px;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 320px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .control-group { margin-bottom: 14px; }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ccc;
    }
    input[type=range], select { width: 100%; cursor: pointer; }
    select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      outline: none;
    }
    select option { background: #111; color: #fff; }
    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    input[type=text] {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }
    input[type=text]:focus {
      border-color: #00ffff;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
    }
    input[type=color] {
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      height: 34px;
      width: 100%;
      cursor: pointer;
      background: transparent;
      padding: 2px;
    }
    input[type=color]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type=color]::-webkit-color-swatch {
      border: none;
      border-radius: 4px;
    }
    button {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
      font-weight: 600;
    }
    button:hover {
      background: #00ffff;
      color: #000000;
      border-color: #00ffff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    #btn-record {
      width: 100%;
      background: rgba(255, 50, 50, 0.2);
      border-color: #ff4444;
      color: #ff8888;
      margin-top: 10px;
      padding: 10px;
    }
    #btn-record.recording {
      background: #ff0000;
      color: #ffffff;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .hint-text {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <!-- Text Morphing -->
    <div class="control-group">
      <label>พิมพ์เพื่อสร้างตัวอักษร:</label>
      <div class="input-group">
        <input type="text" id="textInput" placeholder="พิมพ์เช่น ART, CAR..." value="ART">
        <button id="btn-generate">ส่ง</button>
      </div>
    </div>

    <!-- Geometric & Scatter Shapes -->
    <div class="control-group">
      <label>รูปทรงพื้นฐาน & การกระจาย:</label>
      <div class="btn-grid">
        <button id="btn-scatter" style="grid-column: span 2; background: rgba(0,255,255,0.2);">✨ Scatter (กระจายอิสระ)</button>
        <button id="btn-sphere">Sphere (ทรงกลม)</button>
        <button id="btn-cube">Cube (ลูกบาศก์)</button>
        <button id="btn-torus">Torus (โดนัท)</button>
        <button id="btn-pyramid">Pyramid (พีระมิด)</button>
        <button id="btn-cone">Cone (กรวย)</button>
        <button id="btn-cylinder">Cylinder (กระบอก)</button>
      </div>
    </div>

    <!-- Color Palette Selector & Custom Color -->
    <div class="control-group">
      <label>โทนสีของจุด (Color Scheme):</label>
      <select id="colorSelect">
        <option value="custom">🎨 Custom Color (กำหนดเอง)</option>
        <option value="cyan" selected>Cyan Glow (ฟ้าสว่าง)</option>
        <option value="pink">Neon Pink (ชมพูนีออน)</option>
        <option value="gold">Cyber Gold (ทองคำ)</option>
        <option value="green">Matrix Green (เขียวแมทริกซ์)</option>
        <option value="rainbow">Rainbow Dynamic (หลากสี)</option>
      </select>
    </div>
    
    <div class="control-group" id="customColorGroup">
      <label>เลือกสีอิสระ (Custom Picker):</label>
      <input type="color" id="customColorPicker" value="#00ffff">
    </div>

    <!-- Particle Sliders -->
    <div class="control-group">
      <label>Scale (ขนาดรูปทรง): <span id="scaleVal">1.0</span></label>
      <input type="range" id="shapeScale" min="0.3" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="control-group">
      <label>Size (ขนาดจุด): <span id="sizeVal">1.5</span></label>
      <input type="range" id="pointSize" min="0.5" max="8.0" step="0.1" value="1.5">
    </div>
    <div class="control-group">
      <label>Speed (ความเร็วขยับ): <span id="speedVal">0.002</span></label>
      <input type="range" id="noiseSpeed" min="0" max="0.01" step="0.0005" value="0.002">
    </div>

    <!-- Video Recording Feature -->
    <div class="control-group">
      <label>Export High Quality Visual Asset:</label>
      <button id="btn-record">🔴 บันทึกวิดีโอ (HQ 60FPS)</button>
    </div>
    <div class="hint-text">🖱️ คลิกลากบนหน้าจอเพื่อหมุน 360° | หมุนลูกกลิ้งเพื่อย่อ/ขยาย</div>
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js CDN & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.126.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- 1. SETUP SCENE, CAMERA, RENDERER & ORBIT CONTROLS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 35;

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;

    // --- 2. HIGH DENSITY PARTICLES (40,000 POINTS) ---
    const particleCount = 40000;
    const geometry = new THREE.BufferGeometry();
    
    const currentPositions = new Float32Array(particleCount * 3);
    const targetPositions = new Float32Array(particleCount * 3);
    const rawTargetPositions = new Float32Array(particleCount * 3);
    const initialOffsets = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    let currentScale = 1.0;

    function applyScale() {
      for (let i = 0; i < particleCount * 3; i++) {
        targetPositions[i] = rawTargetPositions[i] * currentScale;
      }
    }

    function setRandomScatter() {
      for (let i = 0; i < particleCount * 3; i += 3) {
        rawTargetPositions[i] = (Math.random() - 0.5) * 50;
        rawTargetPositions[i+1] = (Math.random() - 0.5) * 50;
        rawTargetPositions[i+2] = (Math.random() - 0.5) * 50;
      }
      applyScale();
    }

    for (let i = 0; i < particleCount * 3; i += 3) {
      const x = (Math.random() - 0.5) * 50;
      const y = (Math.random() - 0.5) * 50;
      const z = (Math.random() - 0.5) * 50;

      currentPositions[i] = x;
      currentPositions[i+1] = y;
      currentPositions[i+2] = z;

      rawTargetPositions[i] = x;
      rawTargetPositions[i+1] = y;
      rawTargetPositions[i+2] = z;

      initialOffsets[i] = Math.random() * Math.PI * 2;
      initialOffsets[i+1] = Math.random() * Math.PI * 2;
      initialOffsets[i+2] = Math.random() * Math.PI * 2;

      colors[i] = 0.0;
      colors[i+1] = 1.0;
      colors[i+2] = 1.0;
    }
    applyScale();

    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 1.5,
      sizeAttenuation: false,
      transparent: true,
      opacity: 0.85,
      vertexColors: true,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // --- 3. GEOMETRIC FORM GENERATOR ---
    function generateGeometricShape(type) {
      for (let i = 0; i < particleCount; i++) {
        const idx = i * 3;
        let x = 0, y = 0, z = 0;

        if (type === 'sphere') {
          const u = Math.random(), v = Math.random();
          const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 12;
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.sin(phi) * Math.sin(theta);
          z = r * Math.cos(phi);
        } 
        else if (type === 'cube') {
          const s = 14;
          x = (Math.random() - 0.5) * s;
          y = (Math.random() - 0.5) * s;
          z = (Math.random() - 0.5) * s;
        } 
        else if (type === 'torus') {
          const u = Math.random() * Math.PI * 2, v = Math.random() * Math.PI * 2;
          const R = 10, r = 3.5;
          x = (R + r * Math.cos(v)) * Math.cos(u);
          y = (R + r * Math.cos(v)) * Math.sin(u);
          z = r * Math.sin(v);
        } 
        else if (type === 'pyramid') {
          const h = 14, hHalf = h / 2;
          y = (Math.random() - 0.5) * h;
          const progress = (hHalf - y) / h;
          const baseWidth = progress * 12;
          x = (Math.random() - 0.5) * baseWidth * 2;
          z = (Math.random() - 0.5) * baseWidth * 2;
        } 
        else if (type === 'cone') {
          const h = 14, hHalf = h / 2;
          y = (Math.random() - 0.5) * h;
          const progress = (hHalf - y) / h;
          const radius = progress * 10;
          const theta = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * radius;
          x = r * Math.cos(theta);
          z = r * Math.sin(theta);
        } 
        else if (type === 'cylinder') {
          const h = 14, radius = 7;
          y = (Math.random() - 0.5) * h;
          const theta = Math.random() * Math.PI * 2;
          x = radius * Math.cos(theta);
          z = radius * Math.sin(theta);
        }

        rawTargetPositions[idx] = x;
        rawTargetPositions[idx+1] = y;
        rawTargetPositions[idx+2] = z;
      }
      applyScale();
    }

    // --- 4. ACCURATE AUTO-FITTING TEXT TO POINTS ---
    function textToPoints(text) {
      if (!text || text.trim() === '') return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 1024;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let fontSize = 250;
      ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
      
      const maxAllowedWidth = canvas.width * 0.85;
      let textWidth = ctx.measureText(text.toUpperCase()).width;

      while (textWidth > maxAllowedWidth && fontSize > 20) {
        fontSize -= 5;
        ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
        textWidth = ctx.measureText(text.toUpperCase()).width;
      }

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text.toUpperCase(), canvas.width / 2, canvas.height / 2);

      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const validPoints = [];

      const step = 2; 
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          if (data[(y * canvas.width + x) * 4] > 128) {
            validPoints.push({
              x: (x - canvas.width / 2) * 0.04,
              y: (canvas.height / 2 - y) * 0.04,
              z: (Math.random() - 0.5) * 2.5
            });
          }
        }
      }

      for (let i = 0; i < particleCount; i++) {
        const idx = i * 3;
        if (validPoints.length > 0) {
          const pt = validPoints[i % validPoints.length];
          rawTargetPositions[idx] = pt.x + (Math.random() - 0.5) * 0.15;
          rawTargetPositions[idx+1] = pt.y + (Math.random() - 0.5) * 0.15;
          rawTargetPositions[idx+2] = pt.z;
        }
      }
      applyScale();
    }

    // --- 5. COLOR PALETTE MANAGER ---
    function updateColors(theme) {
      const colorAttr = particleSystem.geometry.attributes.color.array;
      const customHex = document.getElementById('customColorPicker').value;

      for (let i = 0; i < particleCount; i++) {
        const idx = i * 3;
        let c = new THREE.Color();

        if (theme === 'custom') c.set(customHex);
        else if (theme === 'cyan') c.setHex(0x00ffff);
        else if (theme === 'pink') c.setHex(0xff007f);
        else if (theme === 'gold') c.setHex(0xffd700);
        else if (theme === 'green') c.setHex(0x00ff66);
        else if (theme === 'rainbow') {
          c.setHSL((i / particleCount), 1.0, 0.5);
        }

        colorAttr[idx] = c.r;
        colorAttr[idx+1] = c.g;
        colorAttr[idx+2] = c.b;
      }
      particleSystem.geometry.attributes.color.needsUpdate = true;
    }

    // --- 6. HIGH-QUALITY VIDEO RECORDING SYSTEM (25 Mbps & 60 FPS) ---
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    const recordBtn = document.getElementById('btn-record');

    function getBestSupportedMimeType() {
      const types = [
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/mp4;codecs=avc1',
        'video/webm'
      ];
      for (const type of types) {
        if (MediaRecorder.isTypeSupported(type)) {
          return type;
        }
      }
      return '';
    }

    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        // จับสตรีม 60 FPS
        const stream = renderer.domElement.captureStream(60);
        const mimeType = getBestSupportedMimeType();

        // ตั้งค่า Bitrate เป็น 25 Mbps เพื่อความคมชัดสูงสุด
        const options = {
          mimeType: mimeType,
          videoBitsPerSecond: 25000000
        };

        try {
          mediaRecorder = new MediaRecorder(stream, options);
        } catch (err) {
          console.warn("Fallback to default MediaRecorder options due to:", err);
          mediaRecorder = new MediaRecorder(stream);
        }

        recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const extension = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
          a.download = `particle-art-master-4k-${Date.now()}.${extension}`;
          a.click();
          URL.revokeObjectURL(url);
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = '⏹️ หยุดบันทึกและดาวน์โหลด (HQ)';
        recordBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = '🔴 บันทึกวิดีโอ (HQ 60FPS)';
        recordBtn.classList.remove('recording');
      }
    });

    // --- 7. EVENT LISTENERS ---
    document.getElementById('btn-generate').addEventListener('click', () => textToPoints(document.getElementById('textInput').value));
    
    const colorSelect = document.getElementById('colorSelect');
    const customPicker = document.getElementById('customColorPicker');

    colorSelect.addEventListener('change', (e) => {
      updateColors(e.target.value);
    });

    customPicker.addEventListener('input', () => {
      colorSelect.value = 'custom';
      updateColors('custom');
    });

    document.getElementById('btn-scatter').addEventListener('click', setRandomScatter);
    document.getElementById('btn-sphere').addEventListener('click', () => generateGeometricShape('sphere'));
    document.getElementById('btn-cube').addEventListener('click', () => generateGeometricShape('cube'));
    document.getElementById('btn-torus').addEventListener('click', () => generateGeometricShape('torus'));
    document.getElementById('btn-pyramid').addEventListener('click', () => generateGeometricShape('pyramid'));
    document.getElementById('btn-cone').addEventListener('click', () => generateGeometricShape('cone'));
    document.getElementById('btn-cylinder').addEventListener('click', () => generateGeometricShape('cylinder'));

    document.getElementById('shapeScale').addEventListener('input', (e) => {
      currentScale = parseFloat(e.target.value);
      document.getElementById('scaleVal').textContent = currentScale.toFixed(1);
      applyScale();
    });

    document.getElementById('pointSize').addEventListener('input', (e) => {
      material.size = parseFloat(e.target.value);
      document.getElementById('sizeVal').textContent = parseFloat(e.target.value).toFixed(1);
    });

    document.getElementById('noiseSpeed').addEventListener('input', (e) => {
      document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(4);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    textToPoints('ART');

    // --- 8. ANIMATION LOOP ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      const speed = parseFloat(document.getElementById('noiseSpeed').value);
      const positions = particleSystem.geometry.attributes.position.array;

      for (let i = 0; i < particleCount * 3; i += 3) {
        currentPositions[i] += (targetPositions[i] - currentPositions[i]) * 0.04;
        currentPositions[i+1] += (targetPositions[i+1] - currentPositions[i+1]) * 0.04;
        currentPositions[i+2] += (targetPositions[i+2] - currentPositions[i+2]) * 0.04;

        positions[i] = currentPositions[i] + Math.sin(elapsedTime * 3 + initialOffsets[i]) * (speed * 100);
        positions[i+1] = currentPositions[i+1] + Math.cos(elapsedTime * 2 + initialOffsets[i+1]) * (speed * 100);
        positions[i+2] = currentPositions[i+2] + Math.sin(elapsedTime * 2.5 + initialOffsets[i+2]) * (speed * 100);
      }

      particleSystem.geometry.attributes.position.needsUpdate = true;
      controls.update();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
